<style>
  :root{
    --surface:#ffffff; --surface-2:#f7f7f8; --surface-3:#f1f1f3;
    --border:#e4e4e7; --border-strong:#d4d4d8;
    --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa;
    --accent:#4f46e5; --accent-soft:#eef2ff;
    --good:#047857; --good-soft:#ecfdf5;
    --warn:#b45309; --warn-soft:#fffbeb;
    --serious:#b91c1c; --serious-soft:#fef2f2;
    --radius:10px;
    --shadow:0 1px 2px rgba(0,0,0,.05);
    --shadow-lg:0 10px 30px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface:#111113; --surface-2:#1a1a1e; --surface-3:#232328;
      --border:#2e2e35; --border-strong:#3f3f46;
      --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
      --accent:#818cf8; --accent-soft:#1e1b4b;
      --good:#34d399; --good-soft:#052e2b;
      --warn:#fbbf24; --warn-soft:#3b2f04;
      --serious:#f87171; --serious-soft:#3f1212;
      --shadow:0 1px 2px rgba(0,0,0,.4);
      --shadow-lg:0 10px 30px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--surface-2);color:var(--ink);font-size:14px;line-height:1.45}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .brand{font-size:15px;font-weight:750;letter-spacing:-.02em;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
  .sidebar .brand .logo{width:26px;height:26px;border-radius:7px;background:#1e2433;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .navitem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;border:none;background:none;color:var(--ink-2);font-size:13.5px;font-weight:550;cursor:pointer;text-align:left;margin-bottom:2px}
  .navitem:hover{background:var(--surface-2);color:var(--ink)}
  .navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
  .navitem .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .navitem .cnt{margin-left:auto;font-size:12px;font-weight:650;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .navitem.active .cnt{color:var(--accent)}
  .navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:650;padding:14px 10px 6px}
  @media(max-width:860px){.sidebar{display:none}}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 28px 80px;flex:1;min-width:0}
  header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  header.top h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
  header.top .sub{color:var(--ink-3);font-size:12.5px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  @media(max-width:760px){.tiles{grid-template-columns:1fr}}
  .tile{background:#1e2433;border:1px solid #303a52;border-radius:var(--radius);padding:18px 20px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s, transform .12s;text-align:left}
  .tile:hover{border-color:#4a5878;transform:translateY(-1px)}
  .tile.active{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.35), var(--shadow)}
  .tile .num{font-size:34px;font-weight:750;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;color:#ffffff}
  .tile .label{font-weight:600;margin-top:4px;color:#ffffff}
  .tile .hint{color:#aab3c5;font-size:12px;margin-top:3px}
  .tile .chip{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:2px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:26px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .panel-head h2{font-size:15px;font-weight:650}
  .panel-head .count{color:var(--ink-3);font-weight:400}
  .search{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--ink);width:220px;outline:none}
  .search:focus{border-color:var(--accent)}
  table{width:100%;border-collapse:collapse}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
  td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  tbody tr{cursor:pointer;transition:background .1s}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:none}
  .co{display:flex;align-items:center;gap:10px;font-weight:600}
  .avatar{width:26px;height:26px;border-radius:7px;background:var(--surface-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-2);flex:none}
  .muted{color:var(--ink-2)} .faint{color:var(--ink-3);font-size:12.5px}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
  .badge.meeting{background:var(--good-soft);color:var(--good)}
  .badge.warm{background:var(--warn-soft);color:var(--warn)}
  .badge.low{background:var(--serious-soft);color:var(--serious)}
  .badge.neutral{background:var(--surface-3);color:var(--ink-2)}
  .seqpill{font-variant-numeric:tabular-nums;font-weight:600}
  .seqpill.zero{color:var(--serious)}
  .cardlist{display:flex;flex-direction:column}
  .acard{padding:16px 18px;border-bottom:1px solid var(--border);cursor:pointer}
  .acard:hover{background:var(--surface-2)}
  .acard:last-child{border-bottom:none}
  .acard .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .acard .row1 .name{font-weight:650;font-size:14.5px}
  .acard .kv{display:grid;grid-template-columns:130px 1fr;gap:2px 14px;font-size:13px;margin-top:6px}
  .acard .kv dt{color:var(--ink-3)}
  .acard .kv dd{color:var(--ink)}
  .notes-snippet{color:var(--ink-2);font-size:13px;margin-top:6px;white-space:pre-line}
  /* detail */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;margin-bottom:14px;cursor:pointer;background:none;border:none;font-weight:600}
  .back:hover{color:var(--ink)}
  .dhead{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
  .dhead .avatar{width:42px;height:42px;font-size:16px;border-radius:10px}
  .dhead h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
  .dmeta{color:var(--ink-3);font-size:13px;margin-bottom:18px;display:flex;gap:14px;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
  .card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;margin-bottom:10px}
  .card p{margin-bottom:8px}
  .card p:last-child{margin-bottom:0}
  .note-item{padding:9px 0;border-bottom:1px solid var(--border)}
  .note-item:last-child{border-bottom:none;padding-bottom:0}
  .note-item .nd{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-bottom:2px}
  .ctable{width:100%} .ctable td,.ctable th{padding:7px 8px;font-size:13px}
  .ctable tbody tr{cursor:default}
  .empty{color:var(--ink-3);font-style:italic}
  .why{background:var(--accent-soft);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .why h3{color:var(--accent)}
  .pre{white-space:pre-line}
  footer{color:var(--ink-3);font-size:12px;text-align:center;margin-top:30px}
</style>
</head>

e. Added to CRM 8/27 per Frank ahead of the Target Markets conference.","lastInteraction":"","priority":false,"recentNotes":[],"conversations":"","contactsReached":[],"seqCount":1,"seqContacts":[{"name":"Brad Robinette","title":"Program Manager","email":"brobinette@quadscore.com","source":"Apollo — Franks Targert Markets Cadence","status":"active"}],"prospects":[{"name":"Brad Robinette","title":"Program Manager","email":"brobinette@quadscore.com","email_status":"on file","phone":"+17703737808","linkedin":""}],"warm":null,"meeting":null,"targetMarkets":true},{"id":"tm-balancepartners-66","name":"Balance Partners","companyType":"","type":"","location":"Columbus, Ohio Metropolitan Area","employees":"","arr":"","description":"","generalNotes":"Target Markets account — contact(s) enrolled in Franks Targert Markets Cadence. Added to CRM 8/27 per Frank ahead of the Target Markets conference.","lastInteraction":"","priority":false,"recentNotes":[],"conversations":"","contactsReached":[],"seqCount":1,"seqContacts":[{"name":"AJ Cericola","title":"CAO","email":"acericola@balanceuw.com","source":"Apollo — Franks Targert Markets Cadence","status":"active"}],"prospects":[{"name":"AJ Cericola","title":"CAO","email":"acericola@balanceuw.com","email_status":"on file","phone":"+16145910249","linkedin":""}],"warm":null,"meeting":null,"targetMarkets":true},{"id":"tm-stonybrookcapital-67","name":"Stonybrook Capital","companyType":"","type":"","location":"New York, New York, United States","employees":"","arr":"","description":"","generalNotes":"Target Markets account — contact(s) enrolled in Franks Targert Markets Cadence. Added to CRM 8/27 per Frank ahead of the Target Markets conference.","lastInteraction":"","priority":false,"recentNotes":[],"conversations":"","contactsReached":[],"seqCount":1,"seqContacts":[{"name":"Paul Dzielinski","title":"Partner","email":"paul.dzielinski@stonybrookcapital.com","source":"Apollo — Franks Targert Markets Cadence","status":"active"}],"prospects":[{"name":"Paul Dzielinski","title":"Partner","email":"paul.dzielinski@stonybrookcapital.com","email_status":"on file","phone":"+19143013565","linkedin":""}],"warm":null,"meeting":null,"targetMarkets":true}],"prospectsRefreshedAt":"2026-08-11","scrubbedAt":"2026-08-17 (full Apollo task-history enumeration) · campaign stats refreshed 2026-08-18","accountResearch":{"researchedAt":"2026-08-11","reports":[{"record_id":"ac9447ee-4a68-4173-a911-fda84479ce77","company":"Creative Underwriters","overview":"Creative Underwriters is a commercial transportation MGA in Jonesboro, GA (est. 1991, ~17 employees, $1M-$10M revenue) writing local, intermediate, and long-haul trucking plus garage, marine, property/GL, and business auto packages. Its programs are fronted by AF Group, which uses Athens Administrators as its TPA; Creative's own claims/TPA arrangement is not fully confirmed. As a lean trucking-focused MGA in a nuclear-verdict-prone line, it is squarely in Vega's sweet spot for AI-driven claims handling and litigation control, and it just became Frank's first booked meeting.","internal_summary":"Months of unanswered outreach (Ian's Jan email to Rhonda Daugherty, Lucas's May sequence and Target Markets invites, Austin's Apr-May LinkedIn messages to Shelley Brown) finally broke through in early August: Frank cold-called Nolan Gard (VP of Operations) on 8/5, followed with missed-call and 'A faster approach to claims' emails, and Gard accepted the 'Creative Underwriters & Vega' meeting for Thursday 8/20 at 2:30 PM ET - Frank's first booked meeting, celebrated in #deal-activity with a deal created in Attio. Jessica sent LinkedIn invites to Gard and Rhonda Daugherty on 8/6, and Tyler has an existing connection to Gard as a warm-intro path. One open flag from Frank's call: the prospect may self-identify as an insurance broker rather than an MGA, which muddied the pitch - Frank planned to review that objection with Lucas before the meeting.","news":[{"date":"2026-02-13","headline":"Enstar to acquire AF Group - Creative's fronting carrier - from Blue Cross Blue Shield of Michigan","summary":"Enstar Group, a legacy/run-off specialist, announced the acquisition of AF Group, the Lansing, MI workers' comp and specialty carrier that fronts Creative Underwriters' programs (and uses Athens Administrators as TPA). Ownership change at the fronting carrier creates uncertainty around Creative's claims arrangements.","url":"https://www.insurancejournal.com/news/midwest/2026/02/13/858075.htm"}],"vega_angle":"The AF Group/Enstar deal is the wedge: Creative's fronting carrier is changing hands to a run-off specialist, which puts its Athens Administrators claims arrangement and program continuity in play - exactly the moment to review claims handling. Walk into the 8/20 Gard meeting with the trucking-specific pitch (litigation under 10%, cycle times cut in half, loss-ratio feedback to underwriting) and pre-empt the 'we're a broker' confusion by framing Vega as the claims partner for their delegated-authority trucking book regardless of label.","best_contacts":[{"name":"Nolan Gard","title":"Vice President of Operations","why":"Meeting booked 8/20 at 2:30 PM ET; owns operations/claims workflow and is the live decision-path - Tyler also has an existing connection to him."},{"name":"Rhonda Daugherty","title":"Vice President of Underwriting","why":"Second power center; already touched via Lucas's Target Markets invites and Jessica's LinkedIn invite - the UW-feedback-loop pitch lands with her."},{"name":"Brandi McClure","title":"Vice President Finance","why":"Verified Apollo prospect with direct phone; the loss-ratio/claims-cost economics case is a finance conversation at a shop this size."},{"name":"Becky Lynch","title":"Transportation Underwriting","why":"Already in Frank's sequence; useful supporting thread into the trucking book if Gard stalls."}],"sources":["https://www.insurancejournal.com/news/midwest/2026/02/13/858075.htm","https://www.enstargroup.com/enstar-announces-acquisition-of-af-group/","http://www.creativeunderwriters.com/","https://www.linkedin.com/company/creative-underwriters-inc","https://leadiq.com/c/creative-underwriters-inc/5a1d8a5e240000240063a258"]},{"record_id":"6a72fd5a-7dd9-555c-92cb-09c1badf4fc1","company":"One80 Intermediaries","overview":"One80 Intermediaries is a Boston-based national wholesale brokerage and program manager (~2,200 employees, 55+ locations, 48+ acquired niche platforms) spanning marine, transportation, property, casualty, financial lines, travel/A&H, and medical stop loss. In August 2025 its parent, Accession Risk Management Group, was acquired by Brown & Brown for $9.825B, and One80 is being folded into Brown & Brown's Bridge Specialty Group alongside Arrowhead Programs. Dozens of acquired programs plus an active integration make it a huge, multi-threaded claims opportunity for Vega - and a meeting with its Director of Claims is on the calendar for tomorrow.","internal_summary":"Heavily worked priority account (18 sequenced contacts) with the first real breakthrough: Preston Lafrance, Director of Claims & Risk Management, accepted Jessica's 8/10 InMail pitch and the 'One80 & Vega' meeting is set for 8/12 at 11:00 AM ET. Supporting threads: Joy LaFrance (CUO, Int'l Excess) connected on a 6/2 cold call and asked for email follow-up; Lucas has worked Joe Bukovsky (transportation programs), Chris Pesce (EVP Programs), and Ed Lopes (COO) since spring; Jessica's 8/10 InMail wave also hit stop-loss leaders Nicholas Milligan and Lori Baker. No responses on the stop-loss thread yet.","news":[{"date":"2025-08-01","headline":"Brown & Brown completes $9.825B acquisition of Accession Risk Management Group, One80's parent","summary":"Brown & Brown closed its acquisition of RSC Topco/Accession (parent of Risk Strategies and One80 Intermediaries), announced June 10, 2025. One80 is now part of Brown & Brown's specialty distribution operations.","url":"https://www.one80.com/news/brown-brown-inc-completes-the-acquisition-of-accession-risk-management-group/"},{"date":"2025-06-10","headline":"Brown & Brown to acquire Risk Strategies/One80 parent for $9.825 billion","summary":"The deal, one of the largest brokerage transactions of 2025, set up One80's integration into Brown & Brown; One80 announced it would join Bridge Specialty Group and Arrowhead Programs.","url":"https://www.insurancejournal.com/news/national/2025/06/10/826916.htm"},{"date":"2025-09-30","headline":"Arrowhead Intermediaries announces leadership appointments and integrates data/analytics teams","summary":"Post-acquisition, the combined Arrowhead/One80 specialty distribution platform reorganized leadership and consolidated data and analytics functions - a signal of ongoing operational integration.","url":"https://www.one80.com/category/news/"},{"date":"2026-01-01","headline":"One80's Waypoint Underwriting signs reinsurance MGU agreement with Hastings Insurance Company","summary":"Waypoint Underwriting Management (the reinsurance MGU One80 acquired in Nov 2024) began a reinsurance MGU agreement with Hastings Insurance effective January 1, 2026, expanding One80's delegated underwriting footprint.","url":"https://www.one80.com/news/waypoint-signs-reinsurance-mgu-agreement-with-hastings-insurance-company/"}],"vega_angle":"Brown & Brown integration means every one of One80's 48+ acquired programs is under operational and margin scrutiny right now - fragmented, inherited claims/TPA arrangements are exactly what gets consolidated. Vega's pitch for tomorrow's Preston Lafrance meeting: one AI-native claims layer that gives program-level and book-level visibility across acquired platforms, with 50% faster resolution and 5-15% lower losses as the integration-era efficiency story. Transportation programs (Bukovsky/Powalie) and stop loss are the concrete beachheads.","best_contacts":[{"name":"Preston Lafrance","title":"Director of Claims & Risk Management","why":"Meeting booked for 8/12 at 11:00 AM ET - the live claims-side decision maker who responded to the Vega pitch."},{"name":"Joy LaFrance","title":"Chief Underwriting Officer (International Excess)","why":"Only other contact who has actually engaged (6/2 connected call, asked for email follow-up); CUO-level sponsor for the underwriting-feedback-loop story."},{"name":"Chris Pesce","title":"EVP, Programs","why":"Owns the program portfolio where claims/TPA decisions concentrate; the natural exec sponsor if the Lafrance meeting goes well."},{"name":"Ed Lopes","title":"Chief Operating Officer","why":"Integration-era ops consolidation lands on his desk; Austin already opened a TPA thread with him in March."},{"name":"Timothy Kelly","title":"Sr. Property/Liability Claims Manager","why":"Frank emailed him 8/11; a practitioner-level ally who can validate cycle-time claims inside the claims org."}],"sources":["https://www.one80.com/news/brown-brown-inc-completes-the-acquisition-of-accession-risk-management-group/","https://www.insurancejournal.com/news/national/2025/06/10/826916.htm","https://bridgespecialtygroup.com/news/better-together/","https://www.one80.com/news/waypoint-signs-reinsurance-mgu-agreement-with-hastings-insurance-company/","https://www.one80.com/category/news/","https://www.businessinsurance.com/brown-brown-completes-risk-strategies-one80-buy/","https://www.insurancebusinessmag.com/us/news/mergers-acquisitions/one80-intermediaries-acquires-waypoint-514680.aspx"]},{"record_id":"f61e9ccd-9889-59cc-b3d2-4afa75aae52d","company":"OSC","overview":"OSC Insurance Services (Kennesaw, GA, 51-250 employees) is a division of Steamboat Group (formerly Breckenridge Group, rebranded July 2023) that provides compliance-driven insurance tracking and lender-placed insurance for banks, mortgage servicers, and lenders, plus a property REI MGA line for real estate investors. It runs programs across five carriers, two of which use TPAs (Blair & Company and Peninsula Insurance Bureau). Notably, its parent Steamboat Group also owns Target Markets Program Administrators Association (TMPAA) - the very conference Vega is targeting in October. OSC is Vega's most active near-term opportunity: a demo is on the calendar for tomorrow, 8/12 at 2:30 PM ET.","internal_summary":"Warmest account in the batch: Vicki Koglmeier (VP of Claims & Loss Administration) held a 7/29 discovery call and revealed OSC's real pain is its own manual FNOL/claims-data-submission process, not TPA performance (TPA choices are carrier-driven). She agreed to a demo of Vega's client dashboard, AI workflows, and data delivery - rescheduled from 8/5 by Vega's side, re-confirmed by Vicki for 8/12 at 2:30 PM ET - and committed to raising Vega's complimentary claims-audit offer with EVP Jose Perez at their 8/4 end-of-month meeting. Lucas also pinged Perez on 8/10 about Target Markets. Deal is in the pipeline; Vicki has been consistently responsive with zero objections.","news":[],"vega_angle":"Sell the intake, not the TPA swap: OSC's stated pain is manual FNOL and claims data submission on their side, so tomorrow's demo should lead with AI-driven intake/workflow automation and the client dashboard, with the claims audit as the expansion path into the two TPA-serviced carrier programs. On the call, ask directly what EVP Jose Perez said about the audit offer at the 8/4 meeting - and use the Steamboat/TMPAA connection to anchor an October Target Markets meetup with the broader Steamboat family (which also includes sister MGA Southeastern Underwriters, already in Vega's pipeline).","best_contacts":[{"name":"Victoria (Vicki) Koglmeier","title":"VP of Claims and Loss Administration","why":"Champion: ran discovery, booked and re-confirmed the 8/12 demo, and is carrying the audit offer to her EVP."},{"name":"Jose Perez (de Corcho)","title":"Executive Vice President","why":"The economic buyer Vicki reports the audit offer to; Lucas already opened a Target Markets thread with him 8/10."},{"name":"Rick Case","title":"Chief Operations Officer","why":"Owns the manual FNOL/intake operations Vega would automate; verified email and phone on file."},{"name":"Keith Gilroy","title":"President / Division President","why":"Top of the OSC division; needed for sign-off if the deal expands beyond claims intake to program-level claims handling."},{"name":"Michael Randall","title":"EVP Business Development and Client Services","why":"Apollo net-new find; client-services angle - OSC resells service quality to lender clients, and faster claims cycles are a client-retention story for him."}],"sources":["https://www.oscis.com/","https://www.oscis.com/who-we-are/company-history/","https://www.oscis.com/breckenridge-group-rebrands-as-steamboat-group-and-launches-new-website/","https://www.oscis.com/insurance/property/lender-placed/","https://leadiq.com/c/osc-a-steamboat-group-company/5d8cf1ed408f0cc3d90d1569"]},{"record_id":"cc89fd8b-2a66-56c3-bcfe-75a4db05d706","company":"Swamp Fox Insurance Agency","overview":"Swamp Fox Agency (Moncks Corner, SC, founded 1987, ~11-50 employees) is an independent agency with a genuine specialty MGA-like forestry/logging program - coverage for loggers, haulers, and equipment operators across eight southeastern states from four offices, and it appears on the Target Markets list under the name Alirics (Principal Rick Quagliaroli's LinkedIn lists him as President of both Swamp Fox and Alirics). Most of its personal/commercial book places claims directly with carriers, but the forestry book is handled in-office and currently uses CBCS as TPA. It is a niche but real fit for Vega on the forestry/trucking-adjacent claims side.","internal_summary":"Mixed signals and cooling: Rick Quagliaroli took a 6/21 call on vacation and explicitly asked for a follow-up email/call, but has gone dark since (7/21 call unanswered, 8/1 email no reply). Meanwhile Danielle Butler declined the Target Markets invite and clarified her side places claims through carriers except the forestry book, and Sarah Stansell (marketing) said on LinkedIn they use CBCS and are 'super happy' - Austin countered with a 20-minute cycle-time/litigation benchmarking offer, no commitment. Ian is LinkedIn-connected to Shauna Harris (Director of Claims). Internal scrub verdict: one more targeted attempt at Rick focused on the in-office forestry book; downgrade if no response by end of August.","news":[{"date":"2026-08-28","headline":"Swamp Fox hosts 4th Annual Loggers Technology Summit, Aug 28-29, 2026 in Birmingham, AL","summary":"Swamp Fox's own two-day summit at the Alabama Sports Hall of Fame and Barber Motorsports Park draws 200+ attendees from 75+ forestry fleets and 20+ technology partners, with sessions on telematics, driver safety, fleet management, and insurance/risk strategy - evidence of a tech-forward posture and a concrete engagement hook in under three weeks.","url":"https://swampfoxagency.com/the-summit/"}],"vega_angle":"The only real fit is the in-office forestry/logging book, and the Loggers Technology Summit (Aug 28-29, ~2.5 weeks out) is the hook: a company that runs a telematics-and-safety-tech conference is the natural audience for an AI-native claims pitch, and attending or referencing the Summit is a warmer path than another cold email. Frame the final Rick Quagliaroli touch as a forestry-claims benchmarking offer (cycle times and litigation vs. CBCS) tied to the Summit's predict-and-prevent theme - then downgrade per plan if he stays dark.","best_contacts":[{"name":"Rick Quagliaroli","title":"Principal / President (Swamp Fox and Alirics)","why":"The decision maker and the only warm-ish thread ('send me a note and I will read it'); also the Alirics/Target Markets connection - one targeted forestry-book attempt left."},{"name":"Shauna Harris","title":"Director of Claims","why":"Runs the in-office forestry claims Vega would actually touch; already LinkedIn-connected to Ian."},{"name":"Rona Smith","title":"Executive Vice President","why":"Senior exec over the forestry book; untested by phone but in Frank's August sequence - alternate exec path around the marketing-desk rejection."},{"name":"Nancy Orvin","title":"Claims","why":"Verified Apollo prospect on the claims desk; practitioner-level source on how the CBCS relationship actually performs."}],"sources":["https://swampfoxagency.com/","https://swampfoxagency.com/the-summit/","https://www.linkedin.com/in/rick-quagliaroli-sfa/","https://forestresources.org/2020/08/10/member-spotlight-swamp-fox-agency/","https://swampfoxagency.com/wp-content/uploads/2024/12/GA-Summit-Booklet-1.pdf"]},{"record_id":"9ede4a8a-6060-5d01-8324-cad48b7c8f7d","company":"Volant Programs","overview":"Volant Programs (Chester, VA, founded 2022) is a fast-growing surplus lines wholesale brokerage and MGU led by CEO Dr. Shawn Clavon, with $51.7M written premium (up from $31M) concentrated in habitational business: a Habitational BOP up to $25M per location, an Excess Property policy to $50M, commercial and homeowner wind/hail deductible buydowns, and terrorism coverage on Lloyd's paper. Carrier partners include Accredited, Clear Blue, and Fortegra; claims run through Synergy (Engle Martin) on pay-as-you-go pricing. A ~67% premium jump on cat-exposed habitational property makes claims capacity and cycle times a live issue - exactly Vega's redundancy-TPA pitch.","internal_summary":"Real discovery happened: a 5/28 cold call got CEO Shawn Clavon to a 7/8 meeting with Lucas and Austin covering Volant's book, TPA setup, and pain (cycle-time gaps on the property side). Shawn is not actively switching TPAs but is open to Vega for future programs or as a redundancy TPA, and was receptive to the complimentary 12-month claims audit; agreed next step was sending the Vega overview and audit summary. Since then the thread went quiet - no reply to Lucas's 7/8 recap or 7/13 demo/audit follow-up, and Attio's 8/10 cold-deals snapshot flagged Volant as 2+ weeks inactive. CUO Jason Kolbl (emailed by Frank 8/10) has never answered. Scrub verdict: re-engage Shawn directly on the agreed audit rather than opening new cold threads.","news":[],"vega_angle":"Revive the deal on the exact commitment Shawn already made: the complimentary 12-month claims audit of the Synergy/Engle Martin-handled habitational book, framed around the property cycle-time gaps he named on 7/8. The growth math is the urgency - premium up 67% to $51.7M on cat-exposed habitational and wind/hail buydown products means one bad storm season stress-tests a pay-as-you-go TPA, and Vega as pre-vetted redundancy/future-program TPA costs him nothing to set up now.","best_contacts":[{"name":"Shawn Clavon","title":"Chief Executive Officer","why":"Founder-decision-maker who took the 7/8 discovery meeting, named the property cycle-time pain, and verbally accepted the free audit - the whole deal runs through him."},{"name":"Jason Kolbl","title":"Chief Underwriting Officer","why":"Second-most-senior exec; owns the loss-ratio outcomes the audit would illuminate, though he has ignored email and calls so far - best reached via Shawn."},{"name":"Kristin Clavon","title":"Commercial Underwriter","why":"Additional inside thread surfaced in external research (likely family at a founder-led shop); practitioner access if the executive thread stays quiet."}],"sources":["https://www.volantprograms.com/","https://www.linkedin.com/company/volant-programs-inc","https://www.zoominfo.com/c/volant-programs-inc/1340912470","https://www.linkedin.com/in/jason-kolbl-2641176"]},{"record_id":"102df135-2412-498b-9c4b-14efd34637d5","company":"Shuttlebee","overview":"Shuttlebee (Asheville, NC, relaunched February 2024) is a pre-revenue insurtech startup building safer student/school transportation: a dispatch-and-marketplace platform for charter schools and families, telematics-based risk mitigation, and a commercial auto insurance program (MGA) slated to launch around spring 2026. Co-founders are CEO Kristina Fahl (ex-Bank of America VP and former head of operations at Bus.com) and Somil Jain, an insurance/actuarial expert who is Chief Actuary at Steadily. It is bootstrapped (pre-seed pending) with an NC IDEA MICRO grant and RevTech Labs accelerator behind it - not yet binding business, so Vega's play is to be the claims infrastructure from day one.","internal_summary":"Watch-list account handled correctly so far: Austin connected with Kristina Fahl on LinkedIn (4/21) but his 6-message sequence and Lucas's May emails went unanswered, and Frank's 8/6 and 8/10 cold emails also got no reply. The meaningful signal is the 7/21 Trellus call with co-founder Somil Jain: Shuttlebee isn't writing policies yet so a TPA is currently irrelevant, but he explicitly agreed to a follow-up in September/October once their launch timeline is clearer. Internal guidance: hold further outreach and re-engage Somil in late September - more cold emails to Kristina before then work against the agreement.","news":[{"date":"2025-12-04","headline":"GrepBeat profiles Shuttlebee: tech + insurance for student transport, insurance launch targeted for spring 2026","summary":"Feature on the Asheville startup's two-pronged model (dispatch marketplace plus commercial auto insurance with telematics-driven predict-and-prevent risk mitigation), its bootstrapped/pre-seed status, and its 3-person core team with 6 advisors/board members.","url":"https://grepbeat.com/2025/12/04/ashevilles-shuttlebee-boosts-school-transport-with-tech-and-insurance/"},{"date":"2025-10","headline":"Shuttlebee wins NC IDEA MICRO grant and graduates RevTech Labs accelerator","summary":"Non-dilutive grant funding from NC IDEA and completion of the Charlotte fintech/insurtech accelerator - validation milestones on the path to its insurance program launch.","url":"https://grepbeat.com/2025/12/04/ashevilles-shuttlebee-boosts-school-transport-with-tech-and-insurance/"}],"vega_angle":"Greenfield claims infrastructure: Shuttlebee's whole brand is telematics-driven predict-and-prevent, and Vega's AI-native TPA is let callFilter = 'all', callQ = '';
function callRows(){
  const calls = (DATA.callLog?.calls)||[];
  return calls.filter(c=>{
    if(callFilter==='connects') { if(!['meeting_booked','connected_positive','connected_neutral','follow_up','not_interested'].includes(c.disposition)) return false; }
    else if(callFilter!=='all' && c.disposition!==callFilter) return false;
    if(callQ && !((c.contact+' '+c.company+' '+(c.title||'')+' '+c.notes).toLowerCase().includes(callQ))) return false;
    return true;
  });
}
function renderCallTable(){
  const rows = callRows();

    const d = DISPO[c.disposition]||DISPO.other;

}

// ---- Auto-refresh: poll the server every 90s for a newer build and reload the moment one is live. ----
// Reload preserves the current view via the hash. Falls back to focus/timer reloads where fetch isn't available (file://).
(function(){
  const loadedAt = Date.now();
  const canPoll = /^https?:$/.test(location.protocol);
  let reloading = false;
  function bump(){ if(reloading) return; reloading = true; location.reload(); }
  if(canPoll){
    async function check(){
      try{
        const r = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'});
        if(!r.ok) return;
        const t = await r.text();
        const m = t.match(/"generatedAt":"([^"]+)"/);
        if(m && DATA && DATA.generatedAt && m[1] !== DATA.generatedAt) bump();
      }catch(e){/* offline/transient — try again next tick */}
    }
    setInterval(check, 90000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Date.now()-loadedAt > 60000) check(); });
  } else {
    // file:// copy: reload on focus + every 10 min so the synced file gets picked up
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Date.now()-loadedAt > 60000) bump(); });
    setInterval(()=>{ if(document.hidden) bump(); }, 600000);
  }
})();

  } else {
    const show = tmSel===null ? accs.map(function(a,i){return i;}) : [tmSel];
    body = show.map(function(k){ const a = accs[k]; return '<div style="padding:8px 0;border-bottom:1px solid rgba(128,128,128,.12)"><strong>'+esc(a.c)+'</strong>'+a.k.map(function(c){ return '<div style="font-size:12px;margin:4px 0 0 6px">'+esc(c.n)+' <span class="faint">'+esc(c.t)+'</span><br><a href="mailto:'+esc(c.e)+'" style="font-size:11px">'+esc(c.e)+'</a>'+(c.ph?' <span class="faint" style="font-size:11px">'+esc(c.ph)+'</span>':'')+'</div>'; }).join('')+'</div>'; }).join('');
  }
  const selHdr = tmSel!==null ? '<div style="margin-bottom:8px"><button onclick="tmGo('+tmSel+')" style="border:none;cursor:pointer;font-size:11px;padding:4px 8px;border-radius:8px;background:rgba(128,128,128,.12);color:inherit">&#8592; All TM accounts</button> <strong style="margin-left:6px">'+esc(accs[tmSel].c)+'</strong></div>' : '';
  document.getElementById('content').innerHTML =
    '<h2 style="margin:4px 0 10px">Target Markets - '+accs.length+' accounts - '+accs.reduce(function(s,a){return s+a.k.length;},0)+' contacts in cadence</h2>'+
    '<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">'+
      '<div style="flex:1.5;min-width:340px"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>'+
        '<th style="text-align:left;padding:6px 10px" class="faint">COMPANY</th><th style="text-align:left;padding:6px" class="faint">PRIO</th><th class="faint" style="padding:6px">CONTACTS</th><th style="text-align:left;padding:6px 10px" class="faint">STATUS</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div style="flex:1;min-width:300px;position:sticky;top:12px;max-height:80vh;overflow-y:auto;padding:12px;border:1px solid rgba(128,128,128,.18);border-radius:12px">'+selHdr+'<div style="margin-bottom:10px">'+tabs+'</div>'+body+'</div>'+
    '</div>';
}

function route(){
  const h = location.hash.replace(/^#\//,'');
  if(h.startsWith('acct/')){ renderNav(null); renderAccount(h.slice(5)); }
  else if(h==='meetings'||h==='meetings-all'||h==='warm'||h==='low'){ renderNav(h); renderList(h); if(h==='warm'){ tmNewLines(); } }
  else if(h==='research-accounts'){ renderNav(h); renderTiles(null); renderResearchAccounts(); window.scrollTo(0,0); }
  else if(h==='research-prospects'){ renderNav(h); renderTiles(null); renderResearchProspects(); window.scrollTo(0,0); }
  else if(h==='calls'){ renderNav(h); renderTiles(null); renderCalls(); window.scrollTo(0,0); }
  else if(h==='held'){ renderNav(h); renderTiles('held'); window.__heldFilter = compMonthKey(); renderHeld(); window.scrollTo(0,0); }
  else if(h==='held-all'){ renderNav('held-all'); renderTiles('held-all'); window.__heldFilter = null; renderHeld(); window.scrollTo(0,0); }
  else if(h==='comp'){ if(isOwner()){ renderNav('comp'); renderComp(); } else { renderNav(''); renderHome(); } window.scrollTo(0,0); }
  else if(h==='tm'){ renderNav('tm'); renderTM(); window.scrollTo(0,0); }
  else { renderNav(''); renderHome(); }
}
window.addEventListener('hashchange', route);
route();
// (Legacy blanket 10-min reload removed — the 90s version poll above reloads only when a newer build is actually live.)
</script>
