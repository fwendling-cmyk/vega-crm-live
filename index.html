<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Vega CRM — Frank's Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📇</text></svg>">
<style>
  :root{
    --surface:#ffffff; --surface-2:#f7f7f8; --surface-3:#f1f1f3;
    --border:#e4e4e7; --border-strong:#d4d4d8;
    --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa;
    --accent:#4f46e5; --accent-soft:#eef2ff;
    --good:#047857; --good-soft:#ecfdf5;
    --warn:#b45309; --warn-soft:#fffbeb;
    --serious:#b91c1c; --serious-soft:#fef2f2;
    --radius:10px;
    --shadow:0 1px 2px rgba(0,0,0,.05);
    --shadow-lg:0 10px 30px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface:#111113; --surface-2:#1a1a1e; --surface-3:#232328;
      --border:#2e2e35; --border-strong:#3f3f46;
      --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
      --accent:#818cf8; --accent-soft:#1e1b4b;
      --good:#34d399; --good-soft:#052e2b;
      --warn:#fbbf24; --warn-soft:#3b2f04;
      --serious:#f87171; --serious-soft:#3f1212;
      --shadow:0 1px 2px rgba(0,0,0,.4);
      --shadow-lg:0 10px 30px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--surface-2);color:var(--ink);font-size:14px;line-height:1.45}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .brand{font-size:15px;font-weight:750;letter-spacing:-.02em;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
  .sidebar .brand .logo{width:26px;height:26px;border-radius:7px;background:#1e2433;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .navitem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;border:none;background:none;color:var(--ink-2);font-size:13.5px;font-weight:550;cursor:pointer;text-align:left;margin-bottom:2px}
  .navitem:hover{background:var(--surface-2);color:var(--ink)}
  .navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
  .navitem .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .navitem .cnt{margin-left:auto;font-size:12px;font-weight:650;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .navitem.active .cnt{color:var(--accent)}
  .navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:650;padding:14px 10px 6px}
  @media(max-width:860px){.sidebar{display:none}}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 28px 80px;flex:1;min-width:0}
  header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  header.top h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
  header.top .sub{color:var(--ink-3);font-size:12.5px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  @media(max-width:760px){.tiles{grid-template-columns:1fr}}
  .tile{background:#1e2433;border:1px solid #303a52;border-radius:var(--radius);padding:18px 20px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s, transform .12s;text-align:left}
  .tile:hover{border-color:#4a5878;transform:translateY(-1px)}
  .tile.active{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.35), var(--shadow)}
  .tile .num{font-size:34px;font-weight:750;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;color:#ffffff}
  .tile .label{font-weight:600;margin-top:4px;color:#ffffff}
  .tile .hint{color:#aab3c5;font-size:12px;margin-top:3px}
  .tile .chip{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:2px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:26px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .panel-head h2{font-size:15px;font-weight:650}
  .panel-head .count{color:var(--ink-3);font-weight:400}
  .search{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--ink);width:220px;outline:none}
  .search:focus{border-color:var(--accent)}
  table{width:100%;border-collapse:collapse}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
  td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  tbody tr{cursor:pointer;transition:background .1s}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:none}
  .co{display:flex;align-items:center;gap:10px;font-weight:600}
  .avatar{width:26px;height:26px;border-radius:7px;background:var(--surface-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-2);flex:none}
  .muted{color:var(--ink-2)} .faint{color:var(--ink-3);font-size:12.5px}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
  .badge.meeting{background:var(--good-soft);color:var(--good)}
  .badge.warm{background:var(--warn-soft);color:var(--warn)}
  .badge.low{background:var(--serious-soft);color:var(--serious)}
  .badge.neutral{background:var(--surface-3);color:var(--ink-2)}
  .seqpill{font-variant-numeric:tabular-nums;font-weight:600}
  .seqpill.zero{color:var(--serious)}
  .cardlist{display:flex;flex-direction:column}
  .acard{padding:16px 18px;border-bottom:1px solid var(--border);cursor:pointer}
  .acard:hover{background:var(--surface-2)}
  .acard:last-child{border-bottom:none}
  .acard .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .acard .row1 .name{font-weight:650;font-size:14.5px}
  .acard .kv{display:grid;grid-template-columns:130px 1fr;gap:2px 14px;font-size:13px;margin-top:6px}
  .acard .kv dt{color:var(--ink-3)}
  .acard .kv dd{color:var(--ink)}
  .notes-snippet{color:var(--ink-2);font-size:13px;margin-top:6px;white-space:pre-line}
  /* detail */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;margin-bottom:14px;cursor:pointer;background:none;border:none;font-weight:600}
  .back:hover{color:var(--ink)}
  .dhead{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
  .dhead .avatar{width:42px;height:42px;font-size:16px;border-radius:10px}
  .dhead h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
  .dmeta{color:var(--ink-3);font-size:13px;margin-bottom:18px;display:flex;gap:14px;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
  .card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;margin-bottom:10px}
  .card p{margin-bottom:8px}
  .card p:last-child{margin-bottom:0}
  .note-item{padding:9px 0;border-bottom:1px solid var(--border)}
  .note-item:last-child{border-bottom:none;padding-bottom:0}
  .note-item .nd{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-bottom:2px}
  .ctable{width:100%} .ctable td,.ctable th{padding:7px 8px;font-size:13px}
  .ctable tbody tr{cursor:default}
  .empty{color:var(--ink-3);font-style:italic}
  .why{background:var(--accent-soft);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .why h3{color:var(--accent)}
  .pre{white-space:pre-line}
  footer{color:var(--ink-3);font-size:12px;text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand"><div class="logo">V</div>Vega CRM</div>
  <nav id="nav"></nav>
</aside>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Vega CRM · Frank's Book</h1>
      <div class="sub" id="subline"></div>
    </div>
    <div class="sub" id="genline"></div>
  </header>

  <div class="tiles" id="tiles"></div>
  <div id="content"></div>
  <footer id="foot"></footer>
</div>
</div>

<script src="crm_base.js"></script>
<script src="crm_live.js"></script>
<script>
const DATA = (function(){
  var B=window.CRM_BASE||{}, L=window.CRM_LIVE||{};
  var D=Object.assign({}, B, L);
  D.accounts=(B.accounts||[]).map(function(a){return Object.assign({},a);});
  var byId={}, byName={}, byDom={};
  D.accounts.forEach(function(a){ byId[a.id]=a; byName[(a.name||"").toLowerCase()]=a; if(a.domain) byDom[a.domain.toLowerCase()]=a; });
  var TPL=["id", "name", "domain", "description", "generalNotes", "companyType", "warm", "low", "meeting"];
  (L.meetings||[]).forEach(function(m){
    var a=byId[m.id]||byName[(m.name||"").toLowerCase()]||(m.domain?byDom[m.domain.toLowerCase()]:null);
    if(!a){ a={}; TPL.forEach(function(k){ a[k]=null; });
      a.id=m.id; a.name=m.name; a.domain=m.domain||""; a.companyType=m.companyType||"";
      a.description=""; a.generalNotes=""; a.location=""; a.recentNotes="";
      a.conversations=[]; a.seqContacts=[]; a.prospects=[]; a.contactsReached=0; a.seqCount=0;
      D.accounts.push(a); byId[a.id]=a; }
    a.meeting=m.meeting;
  });
  delete D.meetings;
  D.meetingsBookedCount=D.accounts.filter(function(a){return !!a.meeting;}).length;
  return D;
})();

const A = DATA.accounts;
const byId = Object.fromEntries(A.map(a=>[a.id,a]));
const mDate = a => { const s=(a.meeting&&a.meeting.meeting_date)||''; return /^\d{4}-\d{2}-\d{2}/.test(s)?s:'0000'; };
const meetings = A.filter(a=>a.meeting).sort((a,b)=> mDate(b).localeCompare(mDate(a)));
const warm = A.filter(a=>a.warm && !a.meeting && !a.dead);
const low = A.filter(a=>a.seqCount < 3 && !a.meeting && !a.warm && !a.dead);

document.getElementById('subline').textContent = `${A.length} accounts · Owner: ${DATA.owner} · Sequence: ${DATA.sequenceName}`;
document.getElementById('genline').textContent = `Data as of ${new Date(DATA.generatedAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}`;
document.getElementById('foot').textContent = `Sources: Google Calendar · Attio · Apollo (incl. Trellus transcripts) · Gmail — refreshed hourly by Claude`;

const esc = s => (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const init = n => n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const fmtLI = s => { if(!s) return '—'; const m = s.match(/(\d\d):(\d\d) (\d\d)\/(\d\d)\/(\d{4})/); if(!m) return s; return `${m[4]}/${m[3]}/${m[5].slice(2)}`; };

/* ===== COMP / EARNINGS (added by Claude - plan per Offer Vega.pdf + Frank 8/27) ===== */
const COMP = {
  base: 85000, startDate: "2026-07-27", target: 3000, fullQuota: 6, rate: 500,
  ramp: {"2026-08": 1, "2026-09": 3},
  bookedByMonth: {"2026-08": 8, "2026-09": 12}
};
function compMonthKey(d){ d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function compQuota(m){ if(m < "2026-08") return 0; return (COMP.ramp[m] !== undefined) ? COMP.ramp[m] : COMP.fullQuota; }
function compRanByMonth(){ const o = {}; (((DATA.meetingsHeld||{}).held)||[]).forEach(function(h){ if(h.held === true && !h.demo && h.date){ const m = String(h.date).slice(0,7); o[m] = (o[m]||0) + 1; } }); return o; }
function compCommission(m, ran){
  const q = compQuota(m); if(!q) return 0;
  const isRamp = COMP.ramp[m] !== undefined;
  const att = ran / q;
  let basePart = Math.min(ran, q) * (COMP.target / q);
  if(isRamp) basePart = Math.max(COMP.target, basePart);
  const over = Math.max(0, ran - q);
  return Math.round(basePart + over * COMP.rate * att);
}
function compMonBooked(){ return COMP.bookedByMonth[compMonthKey()] || 0; }
function compMonRan(){ return compRanByMonth()[compMonthKey()] || 0; }
function compAllRan(){ const r = compRanByMonth(); return Object.keys(r).reduce(function(s,k){ return s + r[k]; }, 0); }
function compMonLabel(){ return new Date().toLocaleString("en-US", {month:"long", year:"numeric"}); }
function fmt$(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
function renderComp(){
  document.getElementById("tiles").innerHTML = "";
  const ran = compRanByMonth();
  const cur = compMonthKey();
  const months = []; let m = "2026-08";
  while(m <= cur){ months.push(m); const y = +m.slice(0,4), mo = +m.slice(5,7); m = (mo === 12) ? (y+1)+"-01" : y + "-" + String(mo+1).padStart(2,"0"); }
  let commYTD = 0;
  const rows = months.map(function(k){
    const q = compQuota(k), r = ran[k] || 0, c = compCommission(k, r);
    commYTD += c;
    const att = q ? Math.round(r/q*100) : 0;
    const nm = new Date(k + "-15T12:00:00").toLocaleString("en-US", {month:"long", year:"numeric"});
    return "<tr><td style='padding:8px 10px;border-bottom:1px solid rgba(128,128,128,.12)'><strong>" + nm + "</strong>" + (COMP.ramp[k] !== undefined ? " <span class='faint' style='font-size:10px'>ramp</span>" : "") + "</td>" +
      "<td style='padding:8px;text-align:center;border-bottom:1px solid rgba(128,128,128,.12)'>" + q + "</td>" +
      "<td style='padding:8px;text-align:center;border-bottom:1px solid rgba(128,128,128,.12)'>" + r + "</td>" +
      "<td style='padding:8px;text-align:center;border-bottom:1px solid rgba(128,128,128,.12)'>" + att + "%</td>" +
      "<td style='padding:8px 10px;text-align:right;border-bottom:1px solid rgba(128,128,128,.12)'><strong>" + fmt$(c) + "</strong></td></tr>";
  }).join("");
  const start = new Date("2026-07-27T00:00:00");
  const now = new Date();
  const daysWorked = Math.max(0, Math.floor((now - start) / 86400000));
  const baseYTD = COMP.base / 365 * daysWorked;
  const yearEnd = new Date("2026-12-31T00:00:00");
  const daysIn2026 = Math.floor((yearEnd - start) / 86400000) + 1;
  const base2026 = COMP.base;
  const monthsElapsed = months.length;
  const avgComm = monthsElapsed ? commYTD / monthsElapsed : 0;
  const remMonths = 12 - (now.getMonth() + 1);
  const proj2026 = base2026 + commYTD + remMonths * avgComm;
  const pace = COMP.base + avgComm * 12;
  const card = function(num, label, hint){ return "<div style='flex:1;min-width:200px;padding:14px;border:1px solid rgba(128,128,128,.18);border-radius:12px'><div style='font-size:24px;font-weight:700'>" + num + "</div><div style='font-weight:600;margin-top:2px'>" + label + "</div><div class='faint' style='font-size:11px;margin-top:2px'>" + hint + "</div></div>"; };
  document.getElementById("content").innerHTML =
    "<h2 style='margin:4px 0 12px'>Earnings - Frank Wendling</h2>" +
    "<div style='display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px'>" +
      card(fmt$(COMP.base), "Base salary", "Guaranteed - started Jul 27, 2026") +
      card(fmt$(commYTD), "Commission earned", "Aug 2026 to date") +
      card(fmt$(baseYTD + commYTD), "Earned so far", daysWorked + " days of base + commission") +
      card(fmt$(proj2026), "2026 projection", "Full $85k base + commission at current pace") +
    "</div>" +
    "<table style='width:100%;max-width:760px;border-collapse:collapse;font-size:13px'><thead><tr>" +
      "<th style='text-align:left;padding:6px 10px' class='faint'>MONTH</th><th class='faint' style='padding:6px'>QUOTA</th><th class='faint' style='padding:6px'>RAN</th><th class='faint' style='padding:6px'>ATTAINMENT</th><th style='text-align:right;padding:6px 10px' class='faint'>COMMISSION</th></tr></thead><tbody>" + rows + "</tbody></table>" +
    "<p class='faint' style='font-size:11px;max-width:760px;margin-top:14px'>Plan: $85,000 base + $3,000/mo variable at quota ($36,000/yr target, $500 per meeting at full quota of 6). Ramp: Aug quota 1, Sep quota 3, Oct+ quota 6 - ramp months pay the full $3,000 guaranteed. Accelerator: over-quota meetings pay $500 x attainment multiple (125% attainment = 1.25x, 150% = 1.5x, and so on). Discovery meetings ran count (demos excluded). Adjust me if the bonus plan doc differs.</p>";
}

/* ===== OWNER GATE + NEW LINES OF BUSINESS (added by Claude) ===== */
function isOwner(){ try { const p = new URLSearchParams(location.search); if (p.get("owner") === "vega-fw-2681") { localStorage.setItem("vega_owner", "1"); } } catch(e) {} return localStorage.getItem("vega_owner") === "1"; }
const NEWLINES = [
  {c:"Mile Auto + Insurance House", w:"Acquired Insurance House eff. Jul 1 - 55k+ nonstandard auto policyholders, 10 Southeast states, mid-integration", d:"Jul 1, 2026", u:"https://www.businesswire.com/news/home/20260702211898/en/", a:"Anything-with-wheels at scale; claims ops get rebuilt after acquisitions - Vega's exact wedge."},
  {c:"Aurenity", w:"TWO new excess casualty programs in 60 days: public entities (Vantage paper, Jul) + middle-market excess up to $10M (Fortegra paper, Aug)", d:"Jul-Aug 2026", u:"https://www.businessinsurance.com/Aurenity-launches-excess-casualty-program/", a:"Zero incumbent claims infrastructure on either program. TM P0 - Trainor + Safino mobiles on file."},
  {c:"ARU", w:"First-ever commercial liability line (standalone E&S, $2M/$4M) after years property-only", d:"Jul 1, 2026", u:"https://natlawreview.com/press-releases/aru-launches-standalone-commercial-liability-product-expanding-specialty-es", a:"They have property claims habits, not liability ones - clean opening. TM P1."},
  {c:"Rainbow MGA", w:"New Lessor's Risk Only commercial package - CA/TX live, national rollout through 2026", d:"Jun 24, 2026", u:"https://www.einpresswire.com/article/921685956/", a:"High policy count small-commercial property/GL; tech-forward MGA fits the AI-TPA story. TM P0."},
  {c:"Amwins", w:"Self-storage program (Jul 16) + enhanced logistics program (Jul 28)", d:"Jul 2026", u:"https://www.amwins.com/who-we-are/newsroom/amwins-program-underwriters-launches-self-storage-facilities-insurance-program", a:"MEETING PREP: Jason Baynard (Inland Marine P&C) Oct 9 - the logistics program is his world."},
  {c:"Rokstone / Aventum", w:"New US E&O division (Aug 4) + new cyber unit (Jul 17)", d:"Jul-Aug 2026", u:"https://www.insurancebusinessmag.com/us/news/construction/rokstone-appoints-james-hebert-to-lead-new-us-errors-and-omissions-division-584903.aspx", a:"Brand-new US professional lines book being built from zero. TM P0 - Ian Anson in cadence."},
  {c:"Pharmacists Mutual", w:"PM Healthcare Protect - expansion into home health, hospice, senior living professional liability + GL", d:"Jun 24, 2026", u:"https://www.prnewswire.com/news-releases/pharmacists-mutual-insurance-group-expands-coverage-options-for-healthcare-professionals-with-pm-healthcare-protect-302809515.html", a:"Long-tail litigation-heavy classes - the under-8% litigation stat hits hardest here. TM P0 - Leslie Hough mobile."},
  {c:"Amynta Group", w:"Acquiring Southern States ag insurance ops (agribusiness P&C MGU) - closes Q4 2026", d:"Aug 12, 2026", u:"https://www.prnewswire.com/news-releases/amynta-group-announces-agreement-to-acquire-southern-states-insurance-operations-302849047.html", a:"New agribusiness line; claims admin decision is live during integration."},
  {c:"CNA", w:"New Touchstone commercial property product - CA filing Aug 26, fast-quote for CRE/hospitality/retail", d:"Aug 26, 2026", u:"https://www.theinsurer.com/ti/news/cna-submits-commercial-property-insurance-filing-in-california-2026-08-26/", a:"High-volume small/mid commercial property rolling out now. Jay Dipasupil in cadence w/ mobile."},
  {c:"Trivora", w:"Took Carroll Street growth investment in July explicitly to expand into additional product lines", d:"Jul 2026", u:"https://www.carrollstreet.com/news/trivora-july-2026", a:"Call BEFORE the new lines exist and the TPA decision is made. TM P0 - Farhan Shah mobile."}
];
function tmNewLines(){
  const rows = NEWLINES.map(function(n){ return '<div style="padding:10px 0;border-bottom:1px solid rgba(128,128,128,.12)"><strong>' + esc(n.c) + '</strong> <span class="faint" style="font-size:11px">' + esc(n.d) + '</span><div style="font-size:13px;margin-top:2px">' + esc(n.w) + ' <a href="' + n.u + '" target="_blank" style="font-size:11px">source</a></div><div class="faint" style="font-size:12px;margin-top:2px">' + esc(n.a) + '</div></div>'; }).join('');

function badges(a){
  let h='';
  if(a.dead) return `<span class="badge low">✕ Dead / shut down</span>`;
  if(a.meeting) h+=`<span class="badge meeting">● Meeting ${esc(a.meeting.meeting_date.slice(5).replace('-','/'))}</span> `;
  if(a.warm) h+=`<span class="badge warm">● Warm${a.warm.caution?' — caution':''}</span> `;
  if(!a.meeting && !a.warm && a.seqCount<3) h+=`<span class="badge low">● Low coverage</span> `;
  if(a.priority) h+=`<span class="badge neutral">Priority</span>`;
  return h;
}

function contactTable(list, cols){
  if(!list || !list.length) return '<p class="empty">None found</p>';
  return `<div style="overflow-x:auto"><table class="ctable"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead>
  <tbody>${list.map(p=>`<tr>${cols.map(c=>`<td>${c[1](p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

const DISPO = {
  meeting_booked:  {label:'Meeting booked', cls:'meeting'},
  connected_positive:{label:'Connected +', cls:'meeting'},
  follow_up:       {label:'Follow up', cls:'warm'},
  connected_neutral:{label:'Connected', cls:'neutral'},
  gatekeeper:      {label:'Gatekeeper', cls:'neutral'},
  voicemail:       {label:'Voicemail', cls:'neutral'},
  no_answer:       {label:'No answer', cls:'neutral'},
  wrong_number:    {label:'Wrong number', cls:'low'},
  not_interested:  {label:'Not interested', cls:'low'},
  other:           {label:'Other', cls:'neutral'},
};
let callFilter = 'all', callQ = '';
function callRows(){
  const calls = (DATA.callLog?.calls)||[];
  return calls.filter(c=>{
    if(callFilter==='connects') { if(!['meeting_booked','connected_positive','connected_neutral','follow_up','not_interested'].includes(c.disposition)) return false; }
    else if(callFilter!=='all' && c.disposition!==callFilter) return false;
    if(callQ && !((c.contact+' '+c.company+' '+(c.title||'')+' '+c.notes).toLowerCase().includes(callQ))) return false;
    return true;
  });
}
function renderCallTable(){
  const rows = callRows();
  document.getElementById('callbody').innerHTML = rows.map(c=>{
    const d = DISPO[c.disposition]||DISPO.other;
    return `<tr style="cursor:default">
      <td class="muted" style="white-space:nowrap">${esc(c.date)}</td>
      <td><strong>${esc(c.contact)}</strong>${c.title?`<div class="faint">${esc(c.title)}</div>`:''}</td>
      <td><a href="#/acct/${c.account_record_id}">${esc(c.company)}</a></td>
      <td><span class="badge ${d.cls}">${d.label}</span>${c.duration?`<div class="faint">${esc(c.duration)}</div>`:''}</td>
      <td class="muted" style="max-width:340px">${esc(c.notes)}</td>
      <td style="white-space:nowrap">${c.link?`<a href="${esc(c.link)}" target="_blank" rel="noopener">Call ↗</a>`:''}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="empty">No calls match</td></tr>';
  document.getElementById('callcount').textContent = '· ' + rows.length + ' calls';
}
function setCallFilter(f, btn){ callFilter=f; document.querySelectorAll('.cfilter').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderCallTable(); }
function renderCalls(){
  const calls = (DATA.callLog?.calls)||[];
  const counts = {};
  calls.forEach(c=>counts[c.disposition]=(counts[c.disposition]||0)+1);
  const connects = calls.filter(c=>['meeting_booked','connected_positive','connected_neutral','follow_up','not_interested'].includes(c.disposition)).length;
  const chips = [
    ['all','All ('+calls.length+')'],
    ['connects','Connects ('+connects+')'],
    ['meeting_booked','Meeting booked ('+(counts.meeting_booked||0)+')'],
    ['follow_up','Follow up ('+(counts.follow_up||0)+')'],
    ['no_answer','No answer ('+(counts.no_answer||0)+')'],
    ['voicemail','Voicemail ('+(counts.voicemail||0)+')'],
  ].map(([k,l])=>`<button class="navitem cfilter ${callFilter===k?'active':''}" style="width:auto;display:inline-flex;margin:0 4px 0 0" onclick="setCallFilter('${k}',this)">${l}</button>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-head" style="flex-wrap:wrap">
        <h2>Calls <span class="count" id="callcount"></span></h2>
        <input class="search" placeholder="Search calls…" oninput="callQ=this.value.toLowerCase();renderCallTable()">
        <div style="flex-basis:100%;padding-top:8px">${chips}</div>
      </div>
      <div style="overflow-x:auto">
      <table><thead><tr><th>Date</th><th>Contact</th><th>Company</th><th>Outcome</th><th>Call notes</th><th>Link</th></tr></thead>
      <tbody id="callbody"></tbody></table>
      </div>
    </div>
    <p class="faint" style="padding:0 4px">Sources: Trellus dialer logs (via Attio person records), Attio call recordings, Apollo. ${esc(DATA.callLog?.builtAt?('Log built '+DATA.callLog.builtAt+' · '):'')}${calls.length?('Range '+calls[calls.length-1].date+' → '+calls[0].date):''}</p>`;
  renderCallTable();
}

        <span class="faint" style="margin-left:auto">${esc(m.date)} · ${esc(m.time||'')}</span></div>
      <div class="kv">
        <dt>Company</dt><dd><a href="#/acct/${m.record_id}">${esc(m.company)}</a></dd>
        <dt>Prospect</dt><dd><strong>${esc(m.prospect)}</strong>${m.prospect_title?' — '+esc(m.prospect_title):''}${m.attendees?` <span class="faint">(attendees: ${esc(m.attendees)})</span>`:''}</dd>
        <dt>Summary</dt><dd>${esc(m.summary)}</dd>
        ${m.key_takeaways&&m.key_takeaways.length?`<dt>Key takeaways</dt><dd>${m.key_takeaways.map(t=>`<div>• ${esc(t)}</div>`).join('')}</dd>`:''}
        <dt>Next steps</dt><dd><strong>${esc(m.next_steps)}</strong></dd>
        <dt>Links</dt><dd>
          ${m.recording_link?`<a href="${esc(m.recording_link)}" target="_blank" rel="noopener">Recording ↗</a> `:''}
          ${m.transcript_link?`<a href="${esc(m.transcript_link)}" target="_blank" rel="noopener">Transcript ↗</a>`:''}
          ${(!m.recording_link&&!m.transcript_link)?'<span class="empty">No recording/transcript available</span>':''}
        </dd>
      </div>
    </div>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Meetings held <span class="count">· ${hh.filter(m=>m.held).length} held${hh.some(m=>!m.held)?' · '+hh.filter(m=>!m.held).length+' unconfirmed':''}</span></h2></div>
      <div class="cardlist">${cards || '<div class="acard empty">No meetings held yet this month.</div>'}</div>
    </div>
    <p class="faint" style="padding:0 4px">Summaries from Google Meet recordings/transcripts, Granola notes, and Attio meeting records. Updated each refresh cycle.</p>`;
}

// ---- Auto-refresh: poll the server every 90s for a newer build and reload the moment one is live. ----
// Reload preserves the current view via the hash. Falls back to focus/timer reloads where fetch isn't available (file://).
(function(){
  const loadedAt = Date.now();
  const canPoll = /^https?:$/.test(location.protocol);
  let reloading = false;
  function bump(){ if(reloading) return; reloading = true; location.reload(); }
  if(canPoll){
    async function check(){
      try{
        const r = await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'});
        if(!r.ok) return;
        const t = await r.text();
        const m = t.match(/"generatedAt":"([^"]+)"/);
        if(m && DATA && DATA.generatedAt && m[1] !== DATA.generatedAt) bump();
      }catch(e){/* offline/transient — try again next tick */}
    }
    setInterval(check, 90000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Date.now()-loadedAt > 60000) check(); });
  } else {
    // file:// copy: reload on focus + every 10 min so the synced file gets picked up
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Date.now()-loadedAt > 60000) bump(); });
    setInterval(()=>{ if(document.hidden) bump(); }, 600000);
  }
})();
